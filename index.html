<!DOCTYPE html>
<!-- index.html
     The one page of the app. Everything else is loaded by app.js. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- The privacy promise, enforced by the browser: the app may load and contact
       nothing but its own files. See PRIVACY.md. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Biblica</title>
  <meta name="description" content="A Catholic Bible and daily prayer companion that works offline." />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f2f6f1" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Biblica" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <noscript>Biblica needs JavaScript to run.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
